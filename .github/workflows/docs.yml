name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs dependencies
        run: pip install -e ".[docs,connectivity,microstates,model,importance,bids,spectral-model,irasa,cycles,complexity,pac,riemann]"

      # The tutorials run during the build and download public data; cached, a build
      # does not depend on the data servers being up.
      - uses: actions/cache@v6
        with:
          path: mne_data
          key: tutorial-data-${{ hashFiles('tutorials/*.py') }}
      - run: mkdir -p mne_data

      - name: Build Sphinx docs
        env:
          MNE_DATA: ${{ github.workspace }}/mne_data
          MPLBACKEND: Agg
        run: sphinx-build -b html -W docs docs/_build/html

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Here rather than on the workflow, so a pull request's build cannot cancel a pending
    # deployment from main.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
