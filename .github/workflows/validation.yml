name: validation

# Checks eegtable against public MNE datasets: known physiology has to come out of
# real recordings. Downloads about 350 MB from PhysioNet and the MNE servers, so
# it runs on demand and weekly rather than on every push. Runs once on the oldest
# supported MNE and once on the newest, so API drift shows up as a failure here.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

env:
  MNE_DONTWRITE_HOME: "true"
  MPLBACKEND: "Agg"
  MNE_DATA: ${{ github.workspace }}/mne_data
  EEGTABLE_DATASETS: "1"

jobs:
  datasets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported MNE, and the oldest to import with SciPy 1.15 or later.
          - mne: "mne==1.10.*"
            extras: "dev,model,connectivity,microstates,spectral-model,irasa,complexity"
            pytest_args: "--ignore=tests/validation/test_preprocessing.py"
          - mne: "mne"
            extras: "dev,model,connectivity,microstates,spectral-model,irasa,complexity,preprocessing,preprocessing-auto"
            pytest_args: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/cache@v6
        with:
          path: mne_data
          key: mne-datasets-${{ hashFiles('tests/validation/loaders.py') }}
      # A cache miss leaves no directory behind, and MNE will not download into a
      # MNE_DATA that does not exist: every test then errors at setup.
      - run: mkdir -p "$MNE_DATA"
      - run: pip install -e ".[${{ matrix.extras }}]"
      - if: matrix.mne == 'mne==1.10.*'
        run: pip install "mne==1.10.*"
      - run: python -c "import mne; print(mne.__version__)"
      - run: python -c "import antropy, specparam, neurodsp"
      - if: matrix.mne == 'mne'
        run: python -c "import yaml, sklearn, h5io, h5py, filelock, pyprep, autoreject"
      - run: pytest tests/validation -ra --durations=10 ${{ matrix.pytest_args }}
      # The suite rewrites docs/validation from what it observed; keep each run's copy.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-results-${{ strategy.job-index }}
          path: docs/validation/
