name: ci

on: [push, pull_request]

env:
  MNE_DONTWRITE_HOME: "true"
  MPLBACKEND: "Agg"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,model,preprocessing,preprocessing-auto]"
      - run: ruff check src tests
      - run: black --check src tests
      - run: mypy

  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.14"]
        # The README installs on Windows and macOS too. Paths, file replacement and the
        # floats hashed into column names differ there, so they are tested, not assumed.
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,model,preprocessing,preprocessing-auto]"
      - run: pytest
      # A green general run does not prove that the reference fixture was present
      # or that the complete modeling suite remained collectable.
      - run: test -f tests/fixtures/model_reference.npz
      - run: pytest tests/model tests/test_equivalence_model.py -ra

  # The oldest releases pyproject.toml admits. Every other job resolves newer ones, so
  # without this the stated minimums would be claims rather than tested facts.
  minimum-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: >
          pip install -e ".[model]" pytest
          "numpy==1.26.*" "scipy==1.11.*" "pandas==2.0.*" "mne==1.10.*"
      - run: python -c "import numpy, scipy, pandas, mne; print(numpy.__version__, scipy.__version__, pandas.__version__, mne.__version__)"
      - run: >
          pytest -ra --ignore=tests/preprocessing --ignore=tests/validation
          --ignore=tests/paradigm_specific

  optional-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,model,connectivity,microstates,importance,references,preprocessing,preprocessing-auto,bids,spectral-model,irasa,cycles,complexity,pac,riemann]"
      # The cross-checks against third-party implementations are all guarded by
      # find_spec, so a missing package skips them instead of failing. Importing
      # each one here turns that silent skip back into a red build.
      - run: python -c "import antropy, shap, mne_connectivity, sklearn, yaml, autoreject, pyprep, mne_bids, specparam, neurodsp, bycycle, tensorpac, pyriemann"
      - run: >
          pytest tests/test_connectivity.py tests/test_microstates.py
          tests/test_runner_compute.py tests/test_complexity.py tests/test_higuchi.py
          tests/test_spectral_model.py tests/test_irasa.py tests/test_cycles.py
          tests/test_extended_complexity.py
          tests/test_phase.py tests/test_bids.py tests/test_recipe.py tests/test_passband.py
          tests/model tests/paradigm_specific -ra

  # The Go front end is optional for users; its own tests still run here.
  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - run: cd tui && test -z "$(gofmt -l .)" && go vet ./... && go test ./...
      # Process groups differ on Windows; build there too so that path cannot rot.
      - run: cd tui && GOOS=windows go vet ./... && GOOS=windows go build ./...

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - run: python -m venv /tmp/eegtable-wheel
      - run: /tmp/eegtable-wheel/bin/pip install dist/*.whl
      - run: /tmp/eegtable-wheel/bin/python -c "import eegtable"
      - run: /tmp/eegtable-wheel/bin/eegtable --version
      - run: cd /tmp && /tmp/eegtable-wheel/bin/eegtable model init model.yaml
      - run: /tmp/eegtable-wheel/bin/pip install "$(ls dist/*.whl)[preprocessing]"
      - run: cd /tmp && /tmp/eegtable-wheel/bin/eegtable preprocess init preprocessing.yaml && /tmp/eegtable-wheel/bin/eegtable preprocess steps preprocessing.yaml

  preprocessing-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,preprocessing,preprocessing-auto]" "mne==1.13.2" "pyprep==0.9.0" "autoreject==0.4.3"
      - run: python -c "import yaml, sklearn, pyprep, autoreject"
      - run: MPLBACKEND=Agg pytest tests/preprocessing -ra
