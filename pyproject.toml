[build-system]
# 1.27 reads the SPDX license expression below (PEP 639).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eegtable"
dynamic = ["version"]
description = "Labelled EEG feature extraction and modeling for MNE objects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joshua Duquette", email = "joshua.duquette.1@ulaval.ca" }]
keywords = [
    "EEG",
    "MNE",
    "feature extraction",
    "event-related desynchronization",
    "ERD/ERS",
    "time-frequency",
    "provenance",
    "neuroscience",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "mne>=1.10"]

[project.urls]
Homepage = "https://github.com/JoshuaDuq/EEGTable"
Documentation = "https://joshuaduq.github.io/EEGTable/"
Source = "https://github.com/JoshuaDuq/EEGTable"
Issues = "https://github.com/JoshuaDuq/EEGTable/issues"
Changelog = "https://github.com/JoshuaDuq/EEGTable/blob/main/CHANGELOG.md"

[project.scripts]
eegtable = "eegtable.runner.cli:main"
[project.optional-dependencies]
preprocessing = ["mne>=1.13.2", "PyYAML>=6.0", "scikit-learn>=1.3", "h5io", "h5py", "filelock"]
preprocessing-auto = ["pyprep>=0.9.0", "autoreject>=0.4.3", "mne-icalabel>=0.6", "onnxruntime>=1.16", "python-picard>=0.7"]
preprocessing-gui = ["mne-qt-browser", "PyQt6"]
bids = ["mne-bids>=0.19", "pybv>=0.8.1"]
connectivity = ["mne-connectivity>=0.7"]
pac = ["tensorpac>=0.6.5"]
# Written against the 2.0 API, first released as 2.0.0rc7; the version used is recorded
# in every output's provenance, so a range does not cost reproducibility.
spectral-model = ["specparam>=2.0.0rc7,<2.1"]
irasa = ["neurodsp>=2.3.0"]
# bycycle 1.2.0 writes into an array that pandas 3's copy-on-write hands back read-only.
cycles = ["bycycle>=1.2.0", "pandas<3.0"]
complexity = ["antropy>=0.2.2"]
riemann = ["scikit-learn>=1.3", "pyriemann>=0.11"]
microstates = ["scikit-learn>=1.3"]
model = ["scikit-learn>=1.3", "PyYAML>=6.0", "filelock>=3.0"]
importance = ["scikit-learn>=1.3", "shap>=0.45"]
# Third-party implementations the test suite checks our own numbers against.
# Not needed to use eegtable; needed to prove the formulas agree with a reference.
references = ["antropy>=0.2.1"]
docs = [
    "furo>=2024.1.29",
    "matplotlib>=3.9",
    "myst-parser>=3.0",
    "scikit-learn>=1.3",
    "sphinx>=7.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "sphinx-notfound-page>=1.0",
    "sphinx-gallery>=0.17",
]
dev = ["pytest>=8.0", "ruff>=0.6", "black>=24.0", "mypy>=1.11", "pandas-stubs", "scipy-stubs", "types-PyYAML", "pybv>=0.8.1"]

[tool.hatch.version]
# One version, read from the package, so the wheel and eegtable.__version__ cannot disagree.
path = "src/eegtable/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eegtable"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/eegtable"]

[[tool.mypy.overrides]]
module = [
    "mne_connectivity.*", "sklearn.*", "shap.*", "joblib.*", "PyQt6.*",
    "mne_bids.*", "specparam.*", "tensorpac.*", "neurodsp.*",
    "bycycle.*", "antropy.*", "pyriemann.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
